[project]
name = "wiki-interest"
dynamic = ["version"]
description = "Wikipedia pageview analysis for B2C product decisions: which topics and languages to pursue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/ANDRIYTS1234/wiki-interest"

[project.scripts]
wiki-interest = "wiki_interest.cli:run"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wiki_interest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_interest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
